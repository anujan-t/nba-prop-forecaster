<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1830" />
    <script>
      (() => {
        const valid = (value) => value === "light" || value === "dark";
        let theme = new URLSearchParams(window.location.search).get("scoutTheme");
        if (!valid(theme)) {
          try { theme = window.localStorage.getItem("courtside.theme"); } catch (error) { theme = null; }
        }
        if (!valid(theme)) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='%23E8702A' stroke='%231B1206' stroke-width='1.5'/%3E%3Cpath d='M16 1.5v29M1.5 16h29M6 5.6c3.6 3 5.6 6.4 5.6 10.4S9.6 23.4 6 26.4M26 5.6c-3.6 3-5.6 6.4-5.6 10.4s2 7.4 5.6 10.4' fill='none' stroke='%231B1206' stroke-width='1.4'/%3E%3C/svg%3E" />
    <meta name="description" content="Courtside: transparent NBA player-prop research with full probability distributions, walk-forward validation and a correlation-aware parlay builder." />
    <style>
      html { background: #ecd6b3; color: #1b2130; color-scheme: light; }
      html[data-theme="dark"] { background: #0b1222; color: #f4efe7; color-scheme: dark; }
    </style>
    <title>COURTSIDE · NBA Prop Research Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
